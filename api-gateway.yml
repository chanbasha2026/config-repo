server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Product Service
            - id: product-service
              uri: http://localhost:9000
              predicates:
                - Path=/v1/products/**

            # Customer Service
            - id: customer-service
              uri: http://localhost:9001
              predicates:
                - Path=/v1/customers/**
